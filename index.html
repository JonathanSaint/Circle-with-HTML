<!DOCTYPE html>
<html lang="en">
<head>
  <title>NearbyChat</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header>
      <div class="header-inner">
        <span class="logo">◎ NearbyChat</span>
        <div class="status-dot"></div>
      </div>

      <!-- New users: enter name -->
      <div id="name-bar" class="hidden">
        <input id="username" placeholder="Enter your name to join..." maxlength="24" autocomplete="off" />
        <button id="joinBtn" onclick="setUsername()">Join</button>
      </div>

      <!-- Returning users: name + actions -->
      <div id="user-label" class="user-label hidden">
        <span id="user-label-text"></span>
        <div class="header-actions">
          <button id="changeNameBtn" onclick="changeName()">Rename</button>
          <button id="clearBtn" onclick="clearChat()">🗑 Clear</button>
        </div>
      </div>
    </header>

    <div id="chat" class="chat-area">
      <div class="welcome-msg">👋 Say something to people nearby...</div>
    </div>

    <div class="input-area">
      <input id="messageInput" placeholder="Type a message..." autocomplete="off" disabled />
      <button id="sendBtn" onclick="sendMessage()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Firebase (no auth SDK needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
